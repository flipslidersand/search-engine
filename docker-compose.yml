services:
  search-engine:
    build: .
    image: search-engine:latest
    container_name: search-engine
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - search_data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - SEARCH_DB=/data/search.db
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-search-engine-docs}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - ALLOWED_INDEX_DIRS=${ALLOWED_INDEX_DIRS:-/data}
      - API_KEY=${API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  search_data:
